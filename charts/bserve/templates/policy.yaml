apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bserve.fullname" . }}
  labels:
    {{- include "bserve.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "bserve.fullname" . }}
  labels:
    {{- include "bserve.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "bserve.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# bserve only answers: BHTTP/1 from anywhere, metrics from the monitoring namespace,
# and no outbound traffic at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bserve.fullname" . }}
  labels:
    {{- include "bserve.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bserve.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - port: bhttp
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - port: metrics
  egress: []
{{- end }}
