kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bhttp
nodes:
  - role: control-plane
    extraPortMappings:
      # bserve NodePort -> localhost:9000 on the host, so ./bcurl localhost:9000/ works.
      - containerPort: 30900
        hostPort: 9000
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
  - role: worker
