name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/krishna-p060/network-project
  # The commit being tested; on pull requests github.sha is a merge commit, not the branch head.
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover tests -v

  config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform and trivy
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Helm lint and schema check
        run: |
          helm lint charts/bserve --set image.tag=ci -f charts/bserve/values-kind.yaml
          helm template bserve charts/bserve --set image.tag=ci -f charts/bserve/values-kind.yaml \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0
      - name: Scan repository for secrets and misconfiguration
        run: trivy fs --scanners secret,misconfig --exit-code 1 --severity HIGH,CRITICAL .

  build:
    needs: [test, config]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${COMMIT::7}" >> "$GITHUB_OUTPUT"
      - name: Build (the test stage runs the unit tests inside the image)
        run: |
          docker build --target test .
          docker build --target runtime --build-arg VERSION=${{ steps.v.outputs.version }} \
            -t $IMAGE:${{ steps.v.outputs.version }} .
      - name: Scan image
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --severity HIGH,CRITICAL --ignore-unfixed $IMAGE:${{ steps.v.outputs.version }}
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 $IMAGE:${{ steps.v.outputs.version }}
      - run: docker save $IMAGE:${{ steps.v.outputs.version }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 3

  e2e:
    needs: build
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: docker load -i image.tar
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: bhttp
          config: deploy/kind-config.yaml
      - name: Deploy with Helm
        run: |
          kind load docker-image $IMAGE:$VERSION --name bhttp
          kubectl create namespace bhttp
          kubectl label namespace bhttp pod-security.kubernetes.io/enforce=restricted
          helm upgrade --install bserve charts/bserve -n bhttp -f charts/bserve/values-kind.yaml \
            --set image.tag=$VERSION --set monitoring.serviceMonitor=false --set monitoring.rules=false \
            --wait --timeout 3m
          kubectl -n bhttp get pods -o wide
      - name: User journey through the NodePort
        run: |
          ./bcurl -v --request-id ci localhost:9000/hello.txt 2> trace.txt | tee body.txt
          cat trace.txt
          grep -q "x-version: $VERSION" trace.txt
          cmp body.txt www/hello.txt
          sleep 2
          kubectl -n bhttp logs -l app.kubernetes.io/component=server --prefix --tail=-1 | grep '"request_id": "ci-1"'
      - name: Bad release is stopped and rolled back
        run: |
          if helm upgrade bserve charts/bserve -n bhttp --reuse-values --set image.tag=does-not-exist --wait --timeout 60s; then
            echo "a release with a missing image should not succeed"; exit 1
          fi
          ./bcurl localhost:9000/hello.txt > /dev/null   # old pods kept serving (maxUnavailable: 0)
          helm -n bhttp rollback bserve --wait
          helm -n bhttp history bserve
          ./bcurl -v localhost:9000/hello.txt 2>&1 >/dev/null | grep "x-version: $VERSION"
      - name: Summary
        if: always()
        run: |
          {
            echo "### bserve $VERSION"
            echo "- commit: \`$COMMIT\`"
            echo "- image: \`$IMAGE:$VERSION\`"
            echo '```'
            kubectl -n bhttp get pods -o wide || true
            helm -n bhttp history bserve || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [build, e2e]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Required reviewers on this environment make publishing a manual approval step.
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: docker load -i image.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image (immutable commit tag only)
        run: |
          docker push $IMAGE:$VERSION
          echo "Published \`$IMAGE:$VERSION\` from \`$COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
